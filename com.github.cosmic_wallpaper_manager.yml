app-id: com.github.cosmic_wallpaper_manager
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: cosmic-wallpaper-gui
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --filesystem=home
  - --talk-name=org.freedesktop.notifications

modules:
  - name: mpvpaper
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/GhostGhostGismo/mpvpaper.git
        tag: 'v1.5'

  - name: cosmic-wallpaper-app
    buildsystem: simple
    build-commands:
      - install -D main.py /app/bin/cosmic-wallpaper-gui
      - install -D com.github.cosmic_wallpaper_manager.desktop /app/share/applications/com.github.cosmic_wallpaper_manager.desktop
    sources:
      - type: dir
        path: src
